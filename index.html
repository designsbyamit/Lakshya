<html lang="en">
<head>

<title>Lakshya - Career Evidence Lab</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{--p:#f4f0e7;--c:#fbfaf6;--ink:#24231f;--mut:#77736b;--line:#d9d1c3;--teal:#236b68;--saf:#d87534;--ind:#444b82;--rose:#a35c67;--gold:#b08a43}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font:14px Inter,system-ui,sans-serif}h1,h2,h3,.serif,.brand{font-family:Georgia,serif;font-weight:500}.top{position:sticky;top:0;background:#f4f0e7ee;backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid var(--line)}.topin{max-width:1200px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between}.brand{font-size:22px}.brand small{display:block;font:9px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}.steps{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);align-self:center}.steps b{color:var(--ink)}.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--saf),var(--teal));transition:.5s}.wrap{max-width:1200px;margin:auto;padding:48px 20px 80px}.hero{text-align:center;max-width:800px;margin:10px auto 35px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;color:var(--saf);font:12px Georgia,serif}.hero h1{font-size:clamp(45px,7vw,78px);line-height:.98;margin:12px 0 18px}.hero p{font-size:17px;color:#646159}.panel,.card,.stat{background:var(--c);border:1px solid var(--line);border-radius:18px}.panel{padding:26px}.drop{border:1.5px dashed #b9b0a1;border-radius:15px;padding:34px;text-align:center;background:#f8f5ed}.drop strong{font:25px Georgia,serif}.drop p,.source p,.sub,.muted{color:var(--mut)}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:99px;padding:10px 16px;background:var(--ink);color:#fff;font-weight:700}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.teal{background:var(--teal)}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.source{border:1px solid var(--line);padding:16px;border-radius:14px;background:#fffdf8}.source h3{margin:0 0 4px;font-size:18px}.source p{font-size:12px;margin:0}.link{display:flex;gap:6px;margin-top:10px}.input,select,textarea{border:1px solid var(--line);background:white;border-radius:10px;padding:10px;width:100%;font:inherit}.template{margin-top:14px;padding:15px;border-radius:14px;background:#eee8db;display:flex;justify-content:space-between;align-items:center;gap:15px}.template p{margin:3px 0;color:var(--mut);font-size:12px}.processing{text-align:center;max-width:650px;margin:70px auto}.orb{width:82px;height:82px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 4%,var(--saf) 5% 25%,var(--ind) 50%,var(--teal) 72%,transparent 73%);animation:pulse 1.8s infinite}.processing h2{font-size:32px}.loader{height:6px;background:#ddd5c8;border-radius:99px;overflow:hidden}.loader i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--saf),var(--teal));transition:.4s}@keyframes pulse{50%{transform:scale(1.05)}}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.head h1{font-size:48px;margin:5px 0}.head p{margin:0;color:var(--mut)}.actions.right{justify-content:flex-end}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.filters>*{width:auto;border-radius:99px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}.stat{padding:16px}.stat b{font:31px Georgia,serif}.stat span{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{padding:18px;min-width:0}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.card h2{margin:0 0 3px;font-size:21px}.sub{font-size:11px;margin-bottom:14px}.barrow{display:grid;grid-template-columns:135px 1fr 30px;gap:7px;align-items:center;margin:9px 0;font-size:11px}.bar{height:8px;background:#e4ded2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}.timeline{display:flex;overflow:auto}.era{min-width:150px;border-top:2px solid var(--teal);padding:12px;position:relative}.era:before{content:'';position:absolute;top:-6px;left:12px;width:9px;height:9px;border-radius:50%;background:var(--teal)}.era b{font:16px Georgia,serif}.era span{display:block;color:var(--mut);font-size:10px;margin-top:4px}.donut{width:135px;height:135px;border-radius:50%;background:conic-gradient(var(--teal) 0 30%,var(--saf) 30% 53%,var(--ind) 53% 74%,var(--rose) 74% 89%,var(--gold) 89%);position:relative}.donut:after{content:'';position:absolute;inset:28px;background:var(--c);border-radius:50%}.donutwrap{display:flex;gap:18px;align-items:center}.legend{font-size:11px;display:grid;gap:6px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.skill{display:grid;grid-template-columns:155px 1fr 34px 26px;gap:6px;align-items:center;font-size:11px;margin:9px 0}.skill input{accent-color:var(--teal)}.edit{width:25px;height:25px;border:1px solid var(--line);background:transparent;border-radius:50%}.insights{display:grid;gap:8px}.insight{padding:12px;background:#f2ede3;border-left:3px solid var(--saf);border-radius:10px}.tag{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--saf);font-weight:800}.insight p{margin:4px 0;font-size:12px}.projects{max-height:420px;overflow:auto}.project{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.project b{font-size:13px}.project span{display:block;color:var(--mut);font-size:10px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.chip{font-size:9px;border:1px solid var(--line);border-radius:99px;padding:2px 6px}.modal{position:fixed;inset:0;background:#24231f77;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.modalbox{background:var(--c);max-width:780px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.mhead{display:flex;justify-content:space-between}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.field label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:block;margin-bottom:4px}.field.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;font-size:11px}.footer{text-align:right;margin-top:15px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:white;padding:11px 14px;border-radius:10px;z-index:20;font-size:12px}@media(max-width:850px){.sources,.stats{grid-template-columns:1fr 1fr}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.head{display:block}.head .actions{margin-top:12px}.skill{grid-template-columns:120px 1fr 32px 25px}}@media(max-width:580px){.sources,.stats{grid-template-columns:1fr}.wrap{padding:30px 13px}.panel{padding:13px}.detail{grid-template-columns:1fr}.field.full{grid-column:auto}.checks{grid-template-columns:1fr 1fr}.head h1{font-size:39px}}
</style>
</head>
<body><div id="app"></div><div id="modal"></div>
<script>
const PROC=['Discovery / strategy','User research','Information architecture','Content design','Interaction design','Visual design','Prototyping','Design systems','Usability testing','Service design','Accessibility','Motion design','Data visualisation','Product strategy','Facilitation','Stakeholder management','Mentoring','AI / ML'];
const HARD=['User research','Interaction design','Visual design','Information architecture','Prototyping','Design systems','Service design','Content design','Accessibility','Motion design','Data visualisation','Product strategy','AI interaction design'];
const SOFT=['Strategic thinking','Storytelling','Leadership','Collaboration','Communication','Mentoring','Stakeholder management','Systems thinking','Judgement','Negotiation','Facilitation'];
const DEVICE=['Responsive web','Mobile app','Desktop app','Kiosk / ATM','TV / large screen','Game / interactive','Physical + digital','Other / not digital'];
const BIZ=['B2B','B2C','B2D','D2C','Internal','Other'];
const INDUSTRY=['Technology','Financial services','Healthcare','Retail / e-commerce','Manufacturing','Education','Media / entertainment','Automotive','Travel / hospitality','Government','Energy','Telecom','Other'];
let S={projects:[],skills:{},source:'',sourceNames:[],filters:{industry:'All',device:'All',business:'All',q:''}};
const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'p'+Date.now()+Math.random();
function base(){return{id:uid(),name:'Untitled project',startDate:'',endDate:'',client:'',expectation:'',outcome:'',deviceType:'',businessModel:'',industry:'',customerRating:'',evidence:'',source:'',skills:{}}}
function initSkills(){let o={};[...HARD,...SOFT].forEach(x=>o[x]={score:null,evidence:0,edited:false});return o}
function save(){localStorage.setItem('lakshya-v1',JSON.stringify(S));try{let r=indexedDB.open('lakshya-career-db',1);r.onupgradeneeded=e=>{let d=e.target.result;['projects','skills','profile'].forEach(x=>{if(!d.objectStoreNames.contains(x))d.createObjectStore(x,{keyPath:x==='skills'?'name':x==='profile'?'key':'id'})})};r.onsuccess=e=>{let d=e.target.result,t=d.transaction(['projects','skills','profile'],'readwrite');let a=t.objectStore('projects');a.clear();S.projects.forEach(p=>a.put(p));let b=t.objectStore('skills');b.clear();Object.entries(S.skills).forEach(([name,v])=>b.put({name,...v}));t.objectStore('profile').put({key:'meta',value:{source:S.source,sourceNames:S.sourceNames}})}}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem('lakshya-v1'));if(x)S=x}catch(e){};if(!Object.keys(S.skills).length)S.skills=initSkills()}
function shell(step){return'<header class="top"><div class="topin"><div class="brand">Lakshya<small>career evidence lab</small></div><div class="steps">'+(step===1?'<b>01 Evidence</b> · 02 Process · 03 Career map':step===2?'01 Evidence · <b>02 Process</b> · 03 Career map':'01 Evidence · 02 Process · <b>03 Career map</b>')+'</div></div><div class="prog"><i style="width:'+(step*33.33)+'%"></i></div></header>'}
function input(){document.getElementById('app').innerHTML=shell(1)+'<main class="wrap"><section class="hero"><div class="eyebrow">Portfolio workshop</div><h1>See the career you actually built.</h1><p>Bring your resume, portfolio, or project history. Lakshya turns evidence into a living career map - facts first, patterns second.</p></section><section class="panel"><div id="drop" class="drop"><strong>Drop your evidence here</strong><p>Resume, portfolio PDF, project spreadsheet, images or documents</p><button class="btn" id="pick">Choose files</button><input id="files" type="file" multiple class="hidden" accept=".pdf,.docx,.xlsx,.xls,.csv,.tsv,.txt,.md,.json,.rtf,.png,.jpg,.jpeg,.webp"></div><div class="sources"><div class="source"><h3>Resume</h3><p>Extract roles, companies, dates and evidence.</p></div><div class="source"><h3>Portfolio link</h3><p>Read a public portfolio and map the work it describes.</p><div class="link"><input class="input" id="url" placeholder="https://yourportfolio.com"><button class="btn teal" id="read">Read</button></div></div><div class="source"><h3>Project data</h3><p>Use the one-sheet template for the strongest project-level analysis.</p></div></div><div class="template"><div><b>Prefer clean project data?</b><p>One row per project. Yes / No for process involvement.</p></div><button class="btn" id="tpl">Download Excel template</button></div><div class="actions"><button class="btn alt" id="demo">Load sample data</button></div></section></main>';bindInput()}
function processing(title='Reading your evidence…'){document.getElementById('app').innerHTML=shell(2)+'<main class="wrap"><section class="processing"><div class="orb"></div><h2 id="pt">'+title+'</h2><p id="pd">Finding projects, skills and career signals.</p><div class="loader"><i id="li"></i></div><div class="muted" id="pc">0%</div></section></main>'}
function prog(n,msg){let i=document.getElementById('li');if(i)i.style.width=n+'%';let c=document.getElementById('pc');if(c)c.textContent=n+'%';let d=document.getElementById('pd');if(d)d.textContent=msg||''}
function bindInput(){let f=document.getElementById('files'),d=document.getElementById('drop');document.getElementById('pick').onclick=()=>f.click();f.onchange=()=>files([...f.files]);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();files([...e.dataTransfer.files])};document.getElementById('read').onclick=()=>{let u=document.getElementById('url').value.trim();if(u)link(u)};document.getElementById('tpl').onclick=template;document.getElementById('demo').onclick=demo}
async function files(fs){if(!fs.length)return;processing();S.projects=[];S.source='files';S.sourceNames=fs.map(x=>x.name);let texts=[];for(let i=0;i<fs.length;i++){let f=fs[i];prog(Math.round(i/fs.length*65),'Reading '+f.name);try{if(/\.(xlsx|xls|csv|tsv)$/i.test(f.name))S.projects.push(...sheet(f));else{let t=await doc(f);if(t)texts.push(t)}}catch(e){console.warn(e)}}prog(76,'Turning evidence into project records');if(texts.length)S.projects.push(...fromText(texts.join('\n'),S.sourceNames.join(', ')));finish();prog(100,'Career map ready');setTimeout(dashboard,400)}
async function link(url){processing('Reading your portfolio…');S.projects=[];S.source='portfolio';S.sourceNames=[url];try{prog(20,'Fetching public portfolio');let r=await fetch('https://r.jina.ai/'+url);if(!r.ok)throw Error();let t=await r.text();prog(60,'Finding project evidence');S.projects=fromText(t,url);prog(85,'Building your evidence model');finish();prog(100,'Career map ready');setTimeout(dashboard,400)}catch(e){prog(0,'I could not read that link. Try a public URL or upload the portfolio instead.');document.getElementById('pt').textContent='Portfolio link could not be read'}}
async function doc(f){let n=f.name.toLowerCase();if(n.endsWith('.docx'))return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;if(n.endsWith('.pdf')){let pdf=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');let p=await pdf.getDocument({data:await f.arrayBuffer()}).promise,t='';for(let i=1;i<=p.numPages;i++){let x=await p.getPage(i),c=await x.getTextContent();t+=c.items.map(a=>a.str).join(' ')+'\n'}return t}if(/\.(png|jpe?g|webp)$/i.test(n))return(await Tesseract.recognize(f,'eng')).data.text;return f.text()}
function sheet(f){let wb=XLSX.read(f instanceof File?undefined: f,{type:'array'});return[]}
async function parseSheetFile(f){let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:''}).map(row).filter(p=>p.name!=='Untitled project')}
function row(r){let p=base(),v=(...ks)=>{let k=Object.keys(r).find(x=>ks.some(y=>x.trim().toLowerCase()===y.toLowerCase()));return k?r[k]:''};p.name=String(v('Project name','Project','Name')||'Untitled project');p.startDate=String(v('Start date','Start','From')||'');p.endDate=String(v('End date','End','To')||'');p.client=String(v('Client / organisation','Client','Organisation','Company')||'');p.expectation=String(v('Expectation at start','Expectation','Brief')||'');p.outcome=String(v('Outcome / impact','Outcome','Impact')||'');p.deviceType=String(v('Device / medium','Device type','Device','Medium')||'');p.businessModel=String(v('Business model','Project model')||'');p.industry=String(v('Industry','Sector')||'');p.customerRating=v('Customer rating / 5','Customer rating','Rating');p.evidence=String(v('Evidence / notes','Evidence','Notes')||'');PROC.forEach(k=>{let z=v(k);if(z!=='')p.skills[k]=/^(yes|y|true|1|x|✓)$/i.test(String(z).trim())});return p}
async function getRows(f){let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]};return XLSX.utils.sheet_to_json(ws,{defval:''}).map(row).filter(p=>p.name!=='Untitled project')}
async function fromFiles(fs){return Promise.all(fs.map(getRows)).then(a=>a.flat())}
async function files(fs){if(!fs.length)return;processing();S.projects=[];S.source='files';S.sourceNames=fs.map(x=>x.name);let texts=[];for(let i=0;i<fs.length;i++){let f=fs[i];prog(Math.round(i/fs.length*65),'Reading '+f.name);try{if(/\.(xlsx|xls)$/i.test(f.name))S.projects.push(...await getRows(f));else if(/\.(csv|tsv)$/i.test(f.name))S.projects.push(...await getRows(new File([await f.text()],f.name,{type:'text/csv'})));else{let t=await doc(f);if(t)texts.push(t)}}catch(e){console.error(e)}}if(texts.length)S.projects.push(...fromText(texts.join('\n'),S.sourceNames.join(', ')));prog(86,'Building your career evidence model');finish();prog(100,'Career map ready');setTimeout(dashboard,400)}
function fromText(t,src){let clean=t.replace(/\s+/g,' ').trim(),parts=clean.split(/(?:case study|project|selected work|experience)\s*[:\-]?/i).map(x=>x.trim()).filter(x=>x.length>90).slice(0,18);if(!parts.length)parts=[clean];return parts.map((x,i)=>{let p=base();p.name=(x.split(/[.!?]/)[0]||'Career evidence '+(i+1)).slice(0,80);p.source=src;p.evidence=x.slice(0,1600);infer(p,x);return p})}
function infer(p,t){let x=t.toLowerCase(),m={'User research':['user research','interview','research'],'Interaction design':['interaction design','wireframe','interaction'],'Visual design':['visual design','ui design','visual'],'Information architecture':['information architecture','navigation'],'Prototyping':['prototype','prototyping','figma'],'Design systems':['design system','component library'],'Usability testing':['usability testing','user testing'],'Service design':['service design','service blueprint'],'Accessibility':['accessibility','wcag'],'Motion design':['motion','animation'],'Data visualisation':['data visualisation','data visualization','dashboard'],'Product strategy':['product strategy','roadmap'],'Facilitation':['workshop','facilitation'],'Stakeholder management':['stakeholder','alignment'],'Mentoring':['mentor','coaching'],'AI / ML':['ai','machine learning','generative ai']};Object.entries(m).forEach(([k,a])=>{if(a.some(w=>x.includes(w)))p.skills[k]=true})}
function finish(){if(!Object.keys(S.skills).length)S.skills=initSkills();[...HARD,...SOFT].forEach(s=>{let n=S.projects.filter(p=>p.skills[s]).length,e=S.skills[s]||{score:null,edited:false};S.skills[s]={...e,evidence:n,score:e.edited?e.score:n?Math.min(5,2+3*n/Math.max(1,S.projects.length)):null}});save()}
function arr(){return S.projects.filter(p=>(S.filters.industry==='All'||p.industry===S.filters.industry)&&(S.filters.device==='All'||p.deviceType===S.filters.device)&&(S.filters.business==='All'||p.businessModel===S.filters.business)&&(!S.filters.q||JSON.stringify(p).toLowerCase().includes(S.filters.q.toLowerCase())))}
function dist(a,k){let m={};a.forEach(p=>{let x=p[k]||'Not specified';m[x]=(m[x]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function skillDist(a){return[...HARD,...SOFT].map(s=>({s,n:a.filter(p=>p.skills[s]).length,score:S.skills[s]?.score})).filter(x=>x.n||x.score).sort((a,b)=>b.n-a.n||b.score-a.score)}
function bars(d){if(!d.length)return'<p class="muted">Not enough structured data.</p>';let mx=d[0][1];return d.slice(0,8).map(x=>'<div class="barrow"><span>'+esc(x[0])+'</span><div class="bar"><i style="width:'+Math.round(x[1]/mx*100)+'%"></i></div><b>'+x[1]+'</b></div>').join('')}
function insights(a){let n=a.length,s=skillDist(a),i=dist(a,'industry'),d=dist(a,'deviceType'),b=dist(a,'businessModel'),o=[];if(s[0])o.push(['Pattern',s[0].s+' appears in '+s[0].n+' of '+n+' projects.']);if(i[0]&&i[0][0]!=='Not specified')o.push(['Concentration',i[0][0]+' is the most represented industry, with '+i[0][1]+' projects.']);if(d[0]&&d[0][0]!=='Not specified')o.push(['Medium','Your work leans toward '+d[0][0]+'. Compare that medium with your strongest skills.']);if(b[0]&&b[0][0]!=='Not specified')o.push(['Context',b[0][0]+' is your most common business context.']);let many=s.filter(x=>x.n>=Math.max(2,Math.ceil(n*.35)));if(many.length>=3)o.push(['Signature','A recurring combination is '+many.slice(0,4).map(x=>x.s).join(', ')+'.']);return o.length?o:[['Early signal','Add richer project rows to move from facts into stronger patterns.']]}
function dashboard(){let a=arr(),sk=skillDist(a),inds=dist(a,'industry'),dev=dist(a,'deviceType'),biz=dist(a,'businessModel');document.getElementById('app').innerHTML=shell(3)+'<main class="wrap"><div class="head"><div><div class="eyebrow">Your career, as evidence</div><h1>The career map</h1><p>'+a.length+' projects in view · '+new Set(a.map(x=>x.industry).filter(Boolean)).size+' industries · '+esc(S.source)+'</p></div><div class="actions right"><button class="btn alt" id="add">Add project</button><button class="btn alt" id="data">Download data</button><button class="btn" id="reset">Start over</button></div></div><div class="filters"><select id="fi"><option>All</option>'+[...new Set(S.projects.map(x=>x.industry).filter(Boolean))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select id="fd"><option>All</option>'+[...new Set(S.projects.map(x=>x.deviceType).filter(Boolean))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select id="fb"><option>All</option>'+[...new Set(S.projects.map(x=>x.businessModel).filter(Boolean))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><input class="input" id="fq" style="width:180px" placeholder="Search projects…" value="'+esc(S.filters.q)+'"><button class="btn alt" id="clear">Clear</button></div><section class="stats"><div class="stat"><b>'+a.length+'</b><span>Projects</span></div><div class="stat"><b>'+new Set(a.map(x=>x.industry).filter(Boolean)).size+'</b><span>Industries</span></div><div class="stat"><b>'+sk.length+'</b><span>Skill signals</span></div><div class="stat"><b>'+a.filter(x=>x.customerRating).length+'</b><span>Client ratings</span></div><div class="stat"><b>'+avgRating(a)+'</b><span>Avg rating</span></div></section><div class="grid"><section class="card s7"><h2>Career timeline</h2><div class="sub">Factual view of when the work happened</div><div class="timeline">'+timeline(a)+'</div></section><section class="card s5"><h2>Work by medium</h2><div class="sub">Factual distribution</div><div class="donutwrap"><div class="donut"></div><div class="legend">'+dev.slice(0,5).map((x,i)=>'<div><i style="background:'+['var(--teal)','var(--saf)','var(--ind)','var(--rose)','var(--gold)'][i]+'"></i>'+esc(x[0])+' · '+x[1]+'</div>').join('')+'</div></div></section><section class="card s6"><h2>Work by industry</h2><div class="sub">Fact visualization</div>'+bars(inds)+'</section><section class="card s6"><h2>Business context</h2><div class="sub">B2B, B2C, B2D and more</div>'+bars(biz)+'</section><section class="card s7"><h2>Skill signals</h2><div class="sub">Evidence frequency with an editable confidence rating</div><div>'+sk.slice(0,14).map(skillHTML).join('')+'</div></section><section class="card s5"><h2>Patterns you may have missed</h2><div class="sub">Inference and insight, not raw facts</div><div class="insights">'+insights(a).map(x=>'<div class="insight"><div class="tag">'+x[0]+'</div><p>'+esc(x[1])+'</p></div>').join('')+'</div></section><section class="card s5"><h2>Project types</h2><div class="sub">What you have actually made</div>'+bars(dev)+'</section><section class="card s7"><h2>Project evidence</h2><div class="sub">Open a record to correct or enrich it</div><div class="projects">'+(a.length?a.map(p=>'<div class="project"><div><b>'+esc(p.name)+'</b><span>'+esc([p.client,p.industry,p.startDate].filter(Boolean).join(' · '))+'</span><div class="chips">'+Object.keys(p.skills).filter(k=>p.skills[k]).slice(0,5).map(k=>'<span class="chip">'+esc(k)+'</span>').join('')+'</div></div><button class="edit" data-p="'+p.id+'">↗</button></div>').join(''):'<p class="muted">No projects match these filters.</p>')+'</div></section><section class="card s12"><h2>How to read this</h2><div class="sub">Lakshya deliberately separates data from interpretation.</div><div class="barrow" style="grid-template-columns:90px 1fr"><b style="color:var(--teal)">FACT</b><span>Directly present or countable in your uploaded evidence.</span></div><div class="barrow" style="grid-template-columns:90px 1fr"><b style="color:var(--saf)">INFERENCE</b><span>Derived by aggregating multiple project signals.</span></div><div class="barrow" style="grid-template-columns:90px 1fr"><b style="color:var(--rose)">INSIGHT</b><span>An interpretation that helps you notice a possible career pattern.</span></div></section></div></main>';bindDash()}
function timeline(a){let m={};a.forEach(p=>{let y=(p.startDate||p.endDate||'').slice(0,4)||'Undated';(m[y]??=[]).push(p)});return Object.keys(m).sort().map(y=>'<div class="era"><b>'+esc(y)+'</b><span>'+m[y].length+' projects</span><span>'+esc(m[y].slice(0,2).map(x=>x.name).join(' · '))+'</span></div>').join('')||'<p class="muted">Add dates to see the arc.</p>'}
function skillHTML(x){let v=S.skills[x.s]?.score;return'<div class="skill"><span>'+esc(x.s)+'</span><input type="range" min="0" max="5" step=".5" value="'+(v??0)+'" '+(v==null?'disabled':'')+' data-r="'+esc(x.s)+'"><b>'+(v==null?'—':Number(v).toFixed(1))+'</b><button class="edit" data-s="'+esc(x.s)+'">'+(v==null?'＋':'↺')+'</button></div>'}
function avgRating(a){let r=a.map(x=>Number(x.customerRating)).filter(x=>x>0);return r.length?(r.reduce((x,y)=>x+y,0)/r.length).toFixed(1):'—'}
function bindDash(){['fi','fd','fb','fq'].forEach(id=>document.getElementById(id).onchange=()=>{S.filters={industry:fi.value,device:fd.value,business:fb.value,q:fq.value};dashboard()});clear.onclick=()=>{S.filters={industry:'All',device:'All',business:'All',q:''};dashboard()};add.onclick=()=>project(null);data.onclick=downloadData;reset.onclick=()=>{if(confirm('Start a new career map?')){localStorage.removeItem('lakshya-v1');S={projects:[],skills:initSkills(),source:'',sourceNames:[],filters:{industry:'All',device:'All',business:'All',q:''}};input()}};document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>project(x.dataset.p));document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>rate(x.dataset.s))}
function rate(s){let v=prompt('Rate your confidence in '+s+' from 0 to 5. Blank removes the rating.',S.skills[s]?.score??'');if(v===null)return;if(v.trim()==='')S.skills[s].score=null;else if(!isNaN(v)&&Number(v)>=0&&Number(v)<=5)S.skills[s].score=Number(v);else return toast('Use a number from 0 to 5');S.skills[s].edited=true;save();dashboard()}
function project(pid){let p=S.projects.find(x=>x.id===pid)||base();let checks=PROC.map(x=>'<label><input type="checkbox" data-c="'+esc(x)+'" '+(p.skills[x]?'checked':'')+'> '+esc(x)+'</label>').join('');modal('<div class="mhead"><h2>'+(pid?'Edit project':'Add project')+'</h2><button class="edit" id="close">×</button></div><div class="detail"><div class="field"><label>Project name</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>Client / organisation</label><input id="pc" value="'+esc(p.client)+'"></div><div class="field"><label>Start date</label><input id="ps" value="'+esc(p.startDate)+'" type="date"></div><div class="field"><label>End date</label><input id="pe" value="'+esc(p.endDate)+'" type="date"></div><div class="field"><label>Device / medium</label><select id="pd">'+DEVICE.map(x=>'<option '+(p.deviceType===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Business model</label><select id="pb">'+BIZ.map(x=>'<option '+(p.businessModel===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Industry</label><select id="pi">'+INDUSTRY.map(x=>'<option '+(p.industry===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Customer rating / 5</label><input id="pr" type="number" min="1" max="5" step=".5" value="'+esc(p.customerRating)+'"></div><div class="field full"><label>Expectation at start</label><textarea id="px">'+esc(p.expectation)+'</textarea></div><div class="field full"><label>Outcome / impact</label><textarea id="po">'+esc(p.outcome)+'</textarea></div><div class="field full"><label>Evidence / notes</label><textarea id="pv">'+esc(p.evidence)+'</textarea></div><div class="field full"><label>Processes involved</label><div class="checks">'+checks+'</div></div></div><div class="footer"><button class="btn" id="save">Save project</button></div>');close.onclick=closeModal;save.onclick=()=>{p.name=pn.value.trim()||'Untitled project';p.client=pc.value;p.startDate=ps.value;p.endDate=pe.value;p.deviceType=pd.value;p.businessModel=pb.value;p.industry=pi.value;p.customerRating=pr.value;p.expectation=px.value;p.outcome=po.value;p.evidence=pv.value;document.querySelectorAll('[data-c]').forEach(c=>p.skills[c.dataset.c]=c.checked);p.source=p.source||'Manual edit';if(!pid)S.projects.push(p);finish();closeModal();dashboard();toast('Project saved')}}
function modal(h){document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="modalbox">'+h+'</div>'}function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
function template(){let h=['Project name','Start date','End date','Client / organisation','Expectation at start','Outcome / impact','Device / medium','Business model','Industry','Customer rating / 5','Evidence / notes',...PROC],r=h.map((x,i)=>i===0?'Example project':i===1?'2025-01-01':i===2?'2025-06-30':i===6?'Responsive web':i===7?'B2B':i===8?'Technology':i>10?'Yes':'');let ws=XLSX.utils.aoa_to_sheet([h,r]);ws['!cols']=h.map(()=>({wch:22}));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Projects');XLSX.writeFile(wb,'Lakshya_Project_Template.xlsx')}
function downloadData(){let rows=S.projects.map(p=>({'Project name':p.name,'Start date':p.startDate,'End date':p.endDate,'Client / organisation':p.client,'Expectation at start':p.expectation,'Outcome / impact':p.outcome,'Device / medium':p.deviceType,'Business model':p.businessModel,'Industry':p.industry,'Customer rating / 5':p.customerRating,'Evidence / notes':p.evidence,...Object.fromEntries(PROC.map(s=>[s,p.skills[s]?'Yes':'No']))}));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Projects');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([...HARD,...SOFT].map(s=>({Skill:s,Type:HARD.includes(s)?'Hard':'Soft',Evidence:S.skills[s]?.evidence||0,Rating:S.skills[s]?.score??''}))),'Skills');XLSX.writeFile(wb,'Lakshya_Career_Map.xlsx')}
function demo(){S.projects=[{id:uid(),name:'Digital banking onboarding',startDate:'2018-01-01',endDate:'2018-08-01',client:'Fintech client',deviceType:'Responsive web',businessModel:'B2C',industry:'Financial services',customerRating:'4.5',expectation:'Reduce friction',outcome:'Improved completion',evidence:'Research, interaction design, prototyping and testing.',skills:{'User research':1,'Interaction design':1,'Prototyping':1,'Usability testing':1}},{id:uid(),name:'Enterprise analytics platform',startDate:'2019-02-01',endDate:'2020-04-01',client:'Global enterprise',deviceType:'Desktop app',businessModel:'B2B',industry:'Technology',customerRating:'4.2',expectation:'Make analytics easier',outcome:'Reusable patterns',evidence:'IA, visual design, design systems, data visualisation.',skills:{'Information architecture':1,'Visual design':1,'Design systems':1,'Data visualisation':1}},{id:uid(),name:'Omnichannel retail experience',startDate:'2021-01-01',endDate:'2022-03-01',client:'Retail group',deviceType:'Mobile app',businessModel:'B2C',industry:'Retail / e-commerce',customerRating:'4.7',expectation:'Connect journeys',outcome:'Unified experience',evidence:'Research, service design, interaction and accessibility.',skills:{'User research':1,'Service design':1,'Interaction design':1,'Accessibility':1}},{id:uid(),name:'AI-assisted enterprise workflow',startDate:'2023-01-01',endDate:'2025-04-01',client:'Enterprise software',deviceType:'Desktop app',businessModel:'B2B',industry:'Technology',customerRating:'4.8',expectation:'Explore responsible AI patterns',outcome:'AI interaction patterns',evidence:'AI, product strategy, prototyping and systems.',skills:{'AI interaction design':1,'Product strategy':1,'Prototyping':1,'Design systems':1}}];S.source='sample';finish();processing('Building your sample career map…');prog(100,'Ready');setTimeout(dashboard,350)}
load();input();
</script></body></html>
